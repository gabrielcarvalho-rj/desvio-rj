spring.application.name=desvio-rj-backend

# Banco PostgreSQL (crie o banco "desvio_rj" antes de subir)
spring.datasource.url=jdbc:postgresql://localhost:5432/desvio_rj
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Porta
server.port=8080

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# JWT (a chave precisa ter no minimo 32 caracteres)
app.jwt.secret=desvio-rj-chave-secreta-super-segura-123456789
app.jwt.expiration-ms=86400000

# Administrador inicial (somente para desenvolvimento local)
app.admin.nome=Administrador
app.admin.email=admin@desviorj.com
app.admin.senha=admin123
# true = a cada subida garante que a senha do admin seja a configurada acima
app.admin.sincronizar-senha=true
