server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA: rotas do React Router (ex.: /lugares/1, /admin)
    # nao existem como arquivos; devolvemos o index.html e o React decide a tela.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos gerados pelo Vite tem hash no nome, podem ficar em cache
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
